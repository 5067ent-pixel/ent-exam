<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENT 專科考試練習</title>
<script>
// 網站入口：帶到目前的正式版本（v/<版本>/）。正式版本由管理者在管理頁發布，記在這台裝置上；
// 新裝置先用下面的預設版本，登入後若有更新會提示。
var D = "1.14.6", v = D;
try { v = localStorage.getItem("ent-release") || D; } catch (e) {}
if (!/^\d+\.\d+\.\d+$/.test(v)) v = D;
location.replace("v/" + v + "/" + location.search);
</script>
</head>
<body><p style="font-family:sans-serif;text-align:center;margin-top:40vh">載入中…</p></body>
</html>
